<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>mjalqasmi Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- One family for both languages (Latin + Arabic) so sizes never change on switch -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #ffffff;
            --bg-subtle: #f3f4f6;
            --bg-hover: #f9fafb;
            --border-color: #e5e7eb;
            --border-active: #111827;
            --text-primary: #111827;
            --text-secondary: #4b5563;
            --text-muted: #6b7280;
            --bg-outer: #f3f4f6;
            --shadow: 0 0 0 1px rgba(17, 24, 39, 0.04), 0 8px 30px rgba(17, 24, 39, 0.06);
            --radius: 6px;
            --tab-fs: 13px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-main: #0d0f12;
                --bg-subtle: #1a1d22;
                --bg-hover: #14171b;
                --border-color: #262a31;
                --border-active: #f3f4f6;
                --text-primary: #f3f4f6;
                --text-secondary: #a8b0bc;
                --text-muted: #7c8592;
                --bg-outer: #07080a;
                --shadow: 0 0 0 1px rgba(0, 0, 0, 0.4), 0 8px 30px rgba(0, 0, 0, 0.5);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'IBM Plex Sans Arabic', system-ui, -apple-system, 'Segoe UI', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            width: 100%;
            background-color: var(--bg-outer);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            overflow: hidden;
        }

        button { font: inherit; }

        .app-container {
            width: 100%;
            max-width: clamp(480px, 41.25vw, 820px);
            height: 100vh;
            height: 100dvh;
            margin: 0 auto;
            background-color: var(--bg-main);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        @media (max-width: 1024px) {
            .app-container {
                max-width: 100%;
                box-shadow: none;
            }
        }

        /* ---------- Header (layout identical in every language) ---------- */
        header {
            flex-shrink: 0;
            background: var(--bg-main);
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
        }

        .top-bar {
            height: 56px;
            box-sizing: content-box;
            padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .brand-name {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            line-height: 24px;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--text-primary);
            text-decoration: none;
            white-space: nowrap;
        }

        #brandText {
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .brand-mark {
            flex-shrink: 0;
            width: 26px;
            height: 26px;
            border-radius: 5px;
            background: var(--text-primary);
            display: grid;
            place-items: center;
        }

        .brand-mark svg {
            width: 10px;
            height: 10px;
            fill: var(--bg-main);
            margin-left: 2px;
        }

        .top-actions {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .lesson-count {
            width: 72px;
            text-align: right;
            font-size: 12px;
            line-height: 16px;
            font-weight: 500;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
        }

        .lang-switch {
            display: flex;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .lang-btn {
            width: 52px;
            height: 30px;
            border: none;
            background: var(--bg-main);
            font-size: 12px;
            line-height: 30px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .lang-btn + .lang-btn { border-left: 1px solid var(--border-color); }

        .lang-btn.active {
            background: var(--text-primary);
            color: var(--bg-main);
        }

        /* ---------- Tabs: equal gaps, all visible, same font size in both languages ---------- */
        .tabs-nav {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            height: 44px;
            border-top: 1px solid var(--border-color);
            padding: 0 max(8px, env(safe-area-inset-right)) 0 max(8px, env(safe-area-inset-left));
            overflow-x: auto;
            scrollbar-width: none;
        }

        .tabs-nav::-webkit-scrollbar { display: none; }

        .tab-btn {
            flex: 0 0 auto;
            position: relative;
            background: none;
            border: none;
            padding: 0 8px;
            font-size: var(--tab-fs);
            line-height: 44px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            transition: color 0.15s ease;
        }

        .tab-btn::after {
            content: "";
            position: absolute;
            left: 8px;
            right: 8px;
            bottom: -1px;
            height: 2px;
            background: transparent;
            transition: background 0.15s ease;
        }

        .tab-btn:hover { color: var(--text-secondary); }
        .tab-btn.active { color: var(--text-primary); }
        .tab-btn.active::after { background: var(--border-active); }

        /* ---------- Horizontal panes (swipe between sections) ---------- */
        .sections-viewport {
            flex: 1;
            display: flex;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            scrollbar-width: none;
            width: 100%;
        }

        .sections-viewport::-webkit-scrollbar { display: none; }

        .section-pane {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: thin;
            background: var(--bg-main);
        }

        .videos-vertical-stack {
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding-bottom: calc(40px + env(safe-area-inset-bottom));
        }

        /* ---------- Video card ---------- */
        .video-card {
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }

        .thumbnail-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: var(--bg-subtle);
            display: grid;
            place-items: center;
            overflow: hidden;
        }

        .thumbnail-box img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.2s ease;
        }

        .video-card:hover .thumbnail-box img { opacity: 0.9; }

        .play-badge {
            position: relative;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(17, 24, 39, 0.7);
            display: grid;
            place-items: center;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .play-badge svg {
            width: 18px;
            height: 18px;
            fill: #fff;
            margin-left: 3px;
        }

        @media (hover: hover) {
            .video-card:hover .play-badge { opacity: 1; }
        }

        .lesson-no {
            position: absolute;
            left: 10px;
            bottom: 10px;
            height: 20px;
            min-width: 20px;
            padding: 0 6px;
            background: rgba(0, 0, 0, 0.78);
            color: #fff;
            font-size: 11px;
            line-height: 20px;
            font-weight: 600;
            border-radius: 3px;
            text-align: center;
        }

        /* fixed line boxes: text length or language never changes card height */
        .video-info {
            padding: 12px 16px 0;
        }

        .video-cat {
            height: 18px;
            font-size: 12px;
            line-height: 18px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 2px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .video-title {
            font-size: 15px;
            line-height: 22px;
            height: 44px;
            font-weight: 600;
            color: var(--text-primary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-desc {
            margin-top: 4px;
            font-size: 13px;
            line-height: 20px;
            height: 40px;
            color: var(--text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .empty-state {
            padding: 64px 24px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            line-height: 20px;
        }

        /* ---------- Watch view ---------- */
        .watch-view {
            position: absolute;
            inset: 0;
            background: var(--bg-main);
            z-index: 200;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.28s cubic-bezier(.2, .8, .2, 1);
            visibility: hidden;
        }

        .watch-view.open {
            transform: translateX(0);
            visibility: visible;
        }

        .watch-bar {
            flex-shrink: 0;
            height: 52px;
            box-sizing: content-box;
            padding: env(safe-area-inset-top) 8px 0;
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 1px solid var(--border-color);
        }

        .back-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: none;
            border-radius: var(--radius);
            display: grid;
            place-items: center;
            cursor: pointer;
            color: var(--text-primary);
        }

        .back-btn:hover { background: var(--bg-subtle); }

        .back-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        .watch-cat {
            min-width: 0;
            font-size: 13px;
            line-height: 20px;
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .watch-scroll {
            flex: 1;
            overflow-y: auto;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .player-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
        }

        .player-box iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .watch-info {
            padding: 16px 16px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .watch-title {
            font-size: 18px;
            line-height: 26px;
            min-height: 52px;
            font-weight: 700;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .watch-desc {
            margin-top: 6px;
            font-size: 14px;
            line-height: 22px;
            color: var(--text-secondary);
        }

        .watch-desc:empty { display: none; }

        .watch-nav {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .nav-btn {
            flex: 1;
            height: 40px;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            background: var(--bg-main);
            color: var(--text-primary);
            font-size: 13px;
            line-height: 38px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .nav-btn:hover:not(:disabled) { background: var(--bg-subtle); }

        .nav-btn.primary {
            background: var(--text-primary);
            color: var(--bg-main);
            border-color: var(--text-primary);
        }

        .nav-btn.primary:hover:not(:disabled) { background: var(--text-secondary); border-color: var(--text-secondary); }

        .nav-btn:disabled { opacity: 0.35; cursor: default; }

        .up-next-label {
            padding: 16px 16px 8px;
            font-size: 12px;
            line-height: 18px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .row-item {
            display: flex;
            gap: 12px;
            padding: 8px 16px;
            cursor: pointer;
        }

        .row-item:hover { background: var(--bg-hover); }
        .row-item.current { background: var(--bg-subtle); }

        .row-thumb {
            flex: 0 0 136px;
            aspect-ratio: 16 / 9;
            border-radius: 4px;
            overflow: hidden;
            background: var(--bg-subtle);
        }

        .row-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .row-text { flex: 1; min-width: 0; }

        .row-title {
            font-size: 14px;
            line-height: 20px;
            height: 40px;
            font-weight: 600;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .row-meta {
            margin-top: 2px;
            font-size: 12px;
            line-height: 18px;
            color: var(--text-muted);
        }

        .row-item.current .row-meta {
            font-weight: 700;
            color: var(--text-primary);
        }

        /* ---------- Large screens ---------- */
        @media (min-width: 769px) {
            .videos-vertical-stack { padding: 16px 16px calc(40px + env(safe-area-inset-bottom)); }
            .thumbnail-box { border-radius: var(--radius); }
            .video-info { padding-left: 2px; padding-right: 2px; }
        }

        /* ---------- Phones ---------- */
        @media (max-width: 480px) {
            .top-bar { height: 52px; padding-left: max(14px, env(safe-area-inset-left)); padding-right: max(14px, env(safe-area-inset-right)); }
            .brand-name { font-size: 15px; gap: 8px; }
            .brand-mark { width: 24px; height: 24px; }
            .lang-btn { width: 46px; height: 28px; line-height: 28px; }
            .videos-vertical-stack { gap: 20px; }
            .video-info { padding: 10px 14px 0; }
            .watch-info { padding: 14px 14px 18px; }
            .watch-title { font-size: 16px; line-height: 24px; min-height: 48px; }
            .row-item { padding: 8px 14px; gap: 10px; }
            .row-thumb { flex-basis: 120px; }
        }

        @media (max-width: 400px) {
            .lesson-count { display: none; }
        }

        /* Phones in landscape: keep the player fully visible */
        @media (max-height: 500px) and (orientation: landscape) {
            .player-box { aspect-ratio: auto; height: 70vh; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="top-bar">
                <a href="#" class="brand-name" id="brand">
                    <span class="brand-mark"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21"/></svg></span>
                    <span id="brandText"></span>
                </a>
                <div class="top-actions">
                    <span class="lesson-count" id="lessonCount" data-dir></span>
                    <div class="lang-switch" role="group" aria-label="Language">
                        <button class="lang-btn" data-lang="en">EN</button>
                        <button class="lang-btn" data-lang="ar">عربي</button>
                    </div>
                </div>
            </div>
            <nav class="tabs-nav" id="tabsNav"></nav>
        </header>

        <main class="sections-viewport" id="viewport"></main>

        <!-- Watch view -->
        <section class="watch-view" id="watchView" aria-hidden="true">
            <div class="watch-bar">
                <button class="back-btn" id="backBtn">
                    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
                </button>
                <span class="watch-cat" id="watchCat"></span>
            </div>
            <div class="watch-scroll" id="watchScroll">
                <div class="player-box" id="playerBox"></div>
                <div class="watch-info">
                    <h1 class="watch-title" id="watchTitle" data-dir></h1>
                    <p class="watch-desc" id="watchDesc" data-dir></p>
                    <div class="watch-nav">
                        <button class="nav-btn" id="prevBtn" data-ui="prev"></button>
                        <button class="nav-btn primary" id="nextBtn" data-ui="next"></button>
                    </div>
                </div>
                <div class="up-next-label" data-ui="inSection" data-dir></div>
                <div id="playlist"></div>
            </div>
        </section>
    </div>

    <script>
// ============================================================
//  Academy content — edit this part only to add / remove lessons
// ============================================================
//
//  CUSTOMER_CODE (optional): the "customer-xxxx" part of your Cloudflare
//  Stream URL, e.g. https://customer-abc123.cloudflarestream.com/...
//  → put "abc123". Leave empty to use the generic videodelivery.net domain.
//
//  Each lesson needs:
//    id    – Cloudflare Stream video UID (32 hex chars)
//    title – lesson title in English (en) and Arabic (ar)
//    desc  – short description in both languages (optional)
//    cat   – index of the category below (0, 1, 2, 3 ...)
//            (an "All" tab showing every lesson is added automatically)

window.ACADEMY = {
  brand: "mjalqasmi Academy",

  CUSTOMER_CODE: "",

  categories: [
    { en: "Cloud & data",  ar: "السحابة والبيانات" },
    { en: "Cybersecurity", ar: "الأمن السيبراني" },
    { en: "Networking",    ar: "الشبكات" },
    { en: "AI",            ar: "الذكاء الاصطناعي" }
  ],

  videos: [
    {
      id: "3cd7c0e565cb68a313036a236b6938a3",
      title: { en: "Enterprise Database Administration & Query Optimization", ar: "إدارة قواعد البيانات المؤسسية وتحسين الاستعلامات" },
      desc:  { en: "", ar: "" },
      cat: 0
    },
    {
      id: "89e47436f0c7a561ce3454b89acb07e5",
      title: { en: "Automated Disaster Recovery & Encrypted Cloud Backups", ar: "التعافي الآلي من الكوارث والنسخ الاحتياطي السحابي المشفّر" },
      desc:  { en: "", ar: "" },
      cat: 0
    },
    {
      id: "892a776d25f5e8b350380b27a7f5e168",
      title: { en: "Digital Media Forensics & EXIF Metadata Management", ar: "التحليل الجنائي للوسائط الرقمية وإدارة بيانات EXIF الوصفية" },
      desc:  { en: "", ar: "" },
      cat: 1
    },
  ]
};
    </script>
    <script>
        const A = window.ACADEMY;

        const UI = {
            en: {
                all: 'All',
                count: n => `${n} lesson${n === 1 ? '' : 's'}`,
                lesson: n => `Lesson ${n}`,
                prev: 'Previous',
                next: 'Next lesson',
                inSection: 'Lessons in this section',
                nowPlaying: 'Now playing',
                soon: 'Lessons coming soon.',
                back: 'Back'
            },
            ar: {
                all: 'الكل',
                count: n => n === 1 ? 'درس واحد' : n === 2 ? 'درسان' : n <= 10 ? `${n} دروس` : `${n} درساً`,
                lesson: n => `الدرس ${n}`,
                prev: 'السابق',
                next: 'الدرس التالي',
                inSection: 'دروس هذا القسم',
                nowPlaying: 'قيد التشغيل',
                soon: 'الدروس قادمة قريباً.',
                back: 'رجوع'
            }
        };
        const LANGS = Object.keys(UI);

        const base = A.CUSTOMER_CODE
            ? `https://customer-${A.CUSTOMER_CODE}.cloudflarestream.com`
            : 'https://videodelivery.net';

        const thumbUrl = (id, h = 360) => `${base}/${id}/thumbnails/thumbnail.jpg?time=2s&height=${h}`;
        const embedUrl = id => A.CUSTOMER_CODE
            ? `${base}/${id}/iframe?autoplay=true&preload=auto`
            : `https://iframe.videodelivery.net/${id}?autoplay=true&preload=auto`;

        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        const byCat = A.categories.map((_, i) => A.videos.filter(v => v.cat === i));
        const panes = [A.videos, ...byCat];
        const tabLabels = l => [UI[l].all, ...A.categories.map(c => trIn(c, l))];
        const hasDesc = v => LANGS.some(l => trIn(v.desc, l));

        const viewport = document.getElementById('viewport');
        const tabsNav = document.getElementById('tabsNav');
        const watchView = document.getElementById('watchView');
        const playerBox = document.getElementById('playerBox');

        let lang = 'en';
        try { lang = localStorage.getItem('academy-lang') || ''; } catch (e) {}
        if (!UI[lang]) lang = (navigator.language || '').startsWith('ar') ? 'ar' : 'en';

        let currentPane = 0;
        let currentVideo = null;

        // text for a given language (falls back to the other one)
        function trIn(obj, l) {
            if (typeof obj === 'string') return obj;
            return obj?.[l] || obj?.en || obj?.ar || '';
        }
        const tr = obj => trIn(obj, lang);

        /*
         * The DOM is built once. Switching language only swaps text and the
         * text direction of text blocks; boxes, sizes and positions stay put.
         * Elements carry what they show:
         *   data-ui="key"        → UI[lang][key]
         *   data-lesson="n"      → "Lesson n"
         *   data-cat="i"         → category name
         *   data-title / data-desc="video index"
         *   data-dir             → gets dir="rtl" in Arabic
         */
        function buildList() {
            tabsNav.innerHTML = panes.map((_, i) =>
                `<button class="tab-btn${i === 0 ? ' active' : ''}" data-i="${i}" ${i ? `data-cat="${i - 1}"` : 'data-ui="all"'}></button>`).join('');
            tabsNav.querySelectorAll('.tab-btn').forEach(btn =>
                btn.addEventListener('click', () => scrollToPane(+btn.dataset.i)));

            viewport.innerHTML = panes.map((list, p) => `
                <section class="section-pane">
                    <div class="videos-vertical-stack">
                        ${list.length ? list.map((v, n) => {
                            const vi = A.videos.indexOf(v);
                            return `
                            <a href="#v=${esc(v.id)}" class="video-card">
                                <div class="thumbnail-box">
                                    <img src="${thumbUrl(v.id, 480)}" alt="" loading="lazy" onerror="this.remove()">
                                    <span class="play-badge"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21"/></svg></span>
                                    <span class="lesson-no" data-lesson="${n + 1}"></span>
                                </div>
                                <div class="video-info" data-dir>
                                    ${p === 0 ? `<div class="video-cat" data-cat="${v.cat}"></div>` : ''}
                                    <h3 class="video-title" data-title="${vi}"></h3>
                                    ${hasDesc(v) ? `<p class="video-desc" data-desc="${vi}"></p>` : ''}
                                </div>
                            </a>`;
                        }).join('') : `<div class="empty-state" data-ui="soon" data-dir></div>`}
                    </div>
                </section>`).join('');
        }

        function applyTexts(root = document) {
            const u = UI[lang];
            root.querySelectorAll('[data-ui]').forEach(el => el.textContent = u[el.dataset.ui]);
            root.querySelectorAll('[data-lesson]').forEach(el => el.textContent = u.lesson(+el.dataset.lesson));
            root.querySelectorAll('[data-cat]').forEach(el => el.textContent = tr(A.categories[+el.dataset.cat]));
            root.querySelectorAll('[data-title]').forEach(el => el.textContent = tr(A.videos[+el.dataset.title].title));
            root.querySelectorAll('[data-desc]').forEach(el => el.textContent = tr(A.videos[+el.dataset.desc].desc));
            root.querySelectorAll('[data-dir]').forEach(el => el.dir = lang === 'ar' ? 'rtl' : 'ltr');
        }

        function applyLang() {
            document.documentElement.lang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
            document.getElementById('lessonCount').textContent = UI[lang].count(A.videos.length);
            document.getElementById('backBtn').setAttribute('aria-label', UI[lang].back);
            applyTexts();
            if (currentVideo) fillWatchTexts(currentVideo);
            else document.title = A.brand;
        }

        function setLang(l) {
            if (l === lang) return;
            lang = l;
            try { localStorage.setItem('academy-lang', l); } catch (e) {}
            applyLang();
        }

        document.querySelectorAll('.lang-btn').forEach(b =>
            b.addEventListener('click', () => setLang(b.dataset.lang)));

        /*
         * One tab font size for BOTH languages: the largest size at which the
         * longer of the two label sets still fits the bar. So every tab is
         * visible and switching language never resizes anything.
         */
        function fitTabs() {
            const MAX = 13, MIN = 10, PAD = 16; // PAD = 8px each side per tab
            const ctx = document.createElement('canvas').getContext('2d');
            const cs = getComputedStyle(tabsNav);
            const avail = tabsNav.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
            ctx.font = `600 ${MAX}px 'IBM Plex Sans Arabic', system-ui, sans-serif`;
            const need = Math.max(...LANGS.map(l =>
                tabLabels(l).reduce((w, s) => w + ctx.measureText(s).width, 0)));
            const n = panes.length;
            const fs = Math.max(MIN, Math.min(MAX, Math.floor(MAX * (avail - n * PAD - 2) / need * 2) / 2));
            tabsNav.style.setProperty('--tab-fs', fs + 'px');
        }

        // ---------- Panes ----------
        function updateActiveTab(index) {
            currentPane = index;
            tabsNav.querySelectorAll('.tab-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
                if (i === index && tabsNav.scrollWidth > tabsNav.clientWidth) {
                    tabsNav.scrollTo({ left: btn.offsetLeft - (tabsNav.clientWidth - btn.offsetWidth) / 2, behavior: 'smooth' });
                }
            });
        }

        function scrollToPane(index) {
            viewport.scrollTo({ left: viewport.clientWidth * index, behavior: 'smooth' });
            updateActiveTab(index);
        }

        function jumpToPane(index) {
            viewport.style.scrollBehavior = 'auto';
            viewport.scrollLeft = viewport.clientWidth * index;
            viewport.style.scrollBehavior = '';
        }

        viewport.addEventListener('scroll', () => {
            const i = Math.round(viewport.scrollLeft / viewport.clientWidth);
            if (i !== currentPane) updateActiveTab(i);
        }, { passive: true });

        window.addEventListener('resize', () => {
            fitTabs();
            jumpToPane(currentPane);
        });

        // ---------- Watch view ----------
        function fillWatchTexts(v) {
            document.getElementById('watchCat').textContent = tr(A.categories[v.cat]);
            document.getElementById('watchTitle').textContent = tr(v.title);
            document.getElementById('watchDesc').textContent = tr(v.desc);
            document.querySelectorAll('.row-item').forEach(r => {
                r.querySelector('.row-meta').textContent = r.classList.contains('current')
                    ? UI[lang].nowPlaying : UI[lang].lesson(+r.dataset.n);
            });
            document.title = `${tr(v.title)} · ${A.brand}`;
        }

        function openVideo(id) {
            const v = A.videos.find(x => x.id === id);
            if (!v) return closeVideo();
            const list = byCat[v.cat] || [v];
            const idx = list.indexOf(v);

            if (currentVideo !== v) {
                playerBox.innerHTML = `<iframe src="${embedUrl(v.id)}"
                    allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;"
                    allowfullscreen></iframe>`;
                document.getElementById('watchScroll').scrollTop = 0;
            }
            currentVideo = v;

            const prev = list[idx - 1], next = list[idx + 1];
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            prevBtn.disabled = !prev;
            nextBtn.disabled = !next;
            prevBtn.onclick = () => prev && (location.hash = 'v=' + prev.id);
            nextBtn.onclick = () => next && (location.hash = 'v=' + next.id);

            const playlist = document.getElementById('playlist');
            playlist.innerHTML = list.map((x, n) => `
                <div class="row-item${x === v ? ' current' : ''}" data-id="${esc(x.id)}" data-n="${n + 1}">
                    <div class="row-thumb"><img src="${thumbUrl(x.id, 180)}" alt="" loading="lazy" onerror="this.remove()"></div>
                    <div class="row-text" data-dir>
                        <div class="row-title" data-title="${A.videos.indexOf(x)}"></div>
                        <div class="row-meta"></div>
                    </div>
                </div>`).join('');
            playlist.querySelectorAll('.row-item').forEach(r =>
                r.addEventListener('click', () => location.hash = 'v=' + r.dataset.id));

            applyTexts(watchView);
            fillWatchTexts(v);
            watchView.classList.add('open');
            watchView.setAttribute('aria-hidden', 'false');
        }

        function closeVideo() {
            currentVideo = null;
            watchView.classList.remove('open');
            watchView.setAttribute('aria-hidden', 'true');
            playerBox.innerHTML = '';
            document.title = A.brand;
        }

        document.getElementById('backBtn').addEventListener('click', () => location.hash = '');

        document.getElementById('brand').addEventListener('click', e => {
            e.preventDefault();
            location.hash = '';
        });

        function route() {
            const m = location.hash.match(/^#v=([\w-]+)/);
            m ? openVideo(m[1]) : closeVideo();
        }

        // ---------- Init ----------
        document.getElementById('brandText').textContent = A.brand;
        buildList();
        applyLang();
        fitTabs();
        // make sure both scripts of the font are loaded before measuring
        if (document.fonts) {
            Promise.all([
                document.fonts.load("600 13px 'IBM Plex Sans Arabic'", 'Aa'),
                document.fonts.load("600 13px 'IBM Plex Sans Arabic'", 'الكل')
            ]).then(fitTabs, fitTabs);
        }
        window.addEventListener('hashchange', route);
        route();
    </script>
</body>
</html>
